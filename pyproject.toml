[project]
name = "industrial-data-bridge"
version = "0.1.0"
description = "Local OT/IT data bridge for a simulated industrial cell"
requires-python = ">=3.12,<3.13"
license = "MIT"
dependencies = [
    "asyncua==2.1.0",
    "fastapi==0.121.3",
    "paho-mqtt==2.1.0",
    "psycopg[binary]==3.2.13",
    "pydantic==2.12.5",
    "pymodbus==3.11.4",
    "uvicorn==0.38.0",
]

[dependency-groups]
dev = ["pytest==8.4.2", "pytest-asyncio==1.2.0", "ruff==0.14.5"]

[build-system]
requires = ["hatchling==1.28.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bridge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["integration: uses real local services"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
